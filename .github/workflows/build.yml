name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the files where Android expects them
        run: |
          P=src/main
          J=$P/java/com/muhannad/studyplan
          mkdir -p $J $P/assets $P/res/layout $P/res/drawable $P/res/xml $P/res/values $P/res/mipmap-xxxhdpi
          cp AndroidManifest.xml $P/
          cp *.java $J/
          cp index.html $P/assets/
          cp widget.xml widget_header.xml widget_item.xml $P/res/layout/
          cp widget_bg.xml item_bg.xml $P/res/drawable/
          cp plan_widget_info.xml $P/res/xml/
          cp values.xml $P/res/values/
          cp icon.png $P/res/mipmap-xxxhdpi/ic_launcher.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Rename
        run: cp build/outputs/apk/debug/*.apk StudyPlan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StudyPlan-apk
          path: StudyPlan.apk

      - name: Publish as a direct download (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StudyPlan.apk \
            --target "${{ github.sha }}" \
            --title "Study Plan (latest build)" \
            --notes "Open this page on your Android phone, tap StudyPlan.apk to download, then open it to install."
